<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recursos especiais</title>
    <style>
        kbd {
           border: solid 1px black; 
        }
        code {
            background-color: rgb(240, 243, 245);
            color: crimson;
        }
        pre > p {
            font-style: italic;
            color: gainsboro;
        }
    </style>
</head>
<body>
    <p>Para copiar esta irformação, pressione <KBd>CTRL</KBd> + <KBd>C</KBd></p>
    <p>Para trocar o fundo de um elemento, utilize o comando 
        <code>background-color.</code></p>
    <p>Comando completo para alterar cor do fundo:</p>
    
    <pre>
        <p>//Neste momento voce aplica desta forma</p>
        <code>
        background-color: aliceblue;
            color: crimson; 
            </code>
    </pre>
</body>
</html>
